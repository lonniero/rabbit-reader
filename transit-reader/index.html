<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Astro Transit Reader</title>
  <link rel="stylesheet" href="style.css?v=13">
</head>
<body>

  <div class="header">TRANSIT READER</div>

  <div class="content">
    <div id="view-list" class="view active">
      <div class="list-view" id="transit-list">
        <!-- Transit items -->
      </div>
    </div>

    <div id="view-mandala" class="view">
      <div class="chart-container" id="chart-mandala">
        <!-- SVG injected here -->
      </div>
    </div>

    <div id="view-combined" class="view">
      <div class="chart-container" id="chart-combined">
        <!-- SVG injected here -->
      </div>
    </div>
  </div>

  <div class="nav">
    <button class="nav-btn active" onclick="switchView('view-list')">LIST</button>
    <button class="nav-btn" onclick="switchView('view-mandala')">MANDALA</button>
    <button class="nav-btn" onclick="switchView('view-combined')">COMBINED</button>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <div id="loading-text" style="font-weight:600;">Initializing...</div>
  </div>

  <script type="module" src="app.js?v=13"></script>
</body>
</html>
