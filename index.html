<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
  <title>Rabbit Reader</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- File input wrapped in label for WebView compatibility -->
  <input type="file" id="file-input" accept=".pdf,.epub" style="position:absolute;top:-9999px;left:-9999px;opacity:0;">

  <!-- ═══ LOADING OVERLAY ═══ -->
  <div id="loading-overlay" class="overlay">
    <div class="loader-ring"></div>
    <div class="loader-text" id="loader-text">Processing...</div>
  </div>
  <!-- ═══ READER (RSVP) ═══ -->
  <div id="reader-screen" class="screen">
    <div class="reader-top">
      <span class="speed-btn" data-action="speed-down">−</span>
      <span class="wpm-display" id="wpm-label">300 WPM</span>
      <span class="speed-btn" data-action="speed-up">+</span>
      <span class="progress-text" id="word-count">0 / 0</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="word-zone" id="word-zone">
      <div class="orp-guide"></div>
      <div id="current-word">Ready</div>
    </div>
    <div class="state-indicator" id="state-label">TAP TO START</div>
    <div class="reader-bottom">
      <div class="ctrl-btn" data-action="prev-chapter" title="Previous Chapter">⟨⟨</div>
      <div class="play-btn" id="btn-play" data-action="toggle-play">▶</div>
      <div class="ctrl-btn" data-action="next-chapter" title="Next Chapter">⟩⟩</div>
    </div>
    <div class="reader-nav">
      <div class="ctrl-btn small" data-action="restart">↺</div>
      <div class="ctrl-btn small" data-action="chapters">☰ Ch.</div>
      <div class="ctrl-btn small" data-action="exit-reader">✕</div>
    </div>
  </div>

  <!-- ═══ BROWSE MODE ═══ -->
  <div id="browse-screen" class="screen">
    <div class="browse-top">
      <span class="browse-title" id="browse-title">Browse</span>
      <span class="browse-hint">tap word → RSVP</span>
    </div>
    <div class="browse-body" id="browse-body"></div>
    <div class="browse-bottom">
      <div class="ctrl-btn small" data-action="back-reader">← RSVP</div>
      <div class="ctrl-btn small" data-action="browse-font-down">A−</div>
      <div class="ctrl-btn small" data-action="browse-font-up">A+</div>
    </div>
  </div>

  <!-- ═══ CHAPTERS ═══ -->
  <div id="chapters-screen" class="screen">
    <div class="screen-header">Chapters</div>
    <div class="lib-list" id="chapter-list"></div>
    <div class="lib-back" data-action="back-reader">← Back to Reader</div>
  </div>

  <!-- ═══ LIBRARY ═══ -->
  <div id="library-screen" class="screen active">
    <div class="screen-header">Library</div>
    <div class="lib-cloud-bar">
      <span id="cloud-status" class="cloud-status">☁ tap to sync</span>
      <div style="display:flex; gap: 4px;">
        <label for="file-input" class="cloud-sync-btn" style="width:auto; padding:0 6px; font-size:8px;">+ LOCAL</label>
        <span class="cloud-sync-btn" data-action="sync-cloud">↻</span>
      </div>
    </div>
    <div class="lib-list" id="lib-list"></div>
  </div>

  <script src="books.js"></script>
  <script src="app.js"></script>
</body>
</html>
