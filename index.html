<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=240, height=282, initial-scale=1.0, user-scalable=no">
  <title>Rabbit Reader</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Hidden file input -->
  <!-- File input wrapped in label for WebView compatibility -->
  <input type="file" id="file-input" accept=".pdf,.epub" style="position:absolute;top:-9999px;left:-9999px;opacity:0;">

  <!-- ═══ MENU ═══ -->
  <div id="menu-screen" class="screen active">
    <div class="logo">Rabbit Reader</div>
    <div class="logo-sub">RSVP Speed Reading</div>
    <div class="menu-btn" data-action="paste">✎ Paste Text</div>
    <label for="file-input" class="menu-btn" id="upload-label">📄 Upload File</label>
    <div class="menu-btn" data-action="url-import">🔗 Import from URL</div>
    <div class="menu-btn" data-action="library">📚 Library</div>
    <div class="menu-hint">scroll wheel adjusts speed</div>
  </div>

  <!-- ═══ LOADING OVERLAY ═══ -->
  <div id="loading-overlay" class="overlay">
    <div class="loader-ring"></div>
    <div class="loader-text" id="loader-text">Processing...</div>
  </div>

  <!-- ═══ INPUT ═══ -->
  <div id="input-screen" class="screen">
    <div class="screen-header">Paste Your Text</div>
    <textarea id="text-input" placeholder="Paste or type text here..."></textarea>
    <div class="input-actions">
      <button data-action="back-menu">← Back</button>
      <button class="primary" data-action="load-input">Read →</button>
    </div>
  </div>

  <!-- ═══ READER ═══ -->
  <div id="reader-screen" class="screen">
    <div class="reader-top">
      <span class="wpm-display" id="wpm-label">300 WPM</span>
      <span class="progress-text" id="word-count">0 / 0</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="word-zone" id="word-zone">
      <div class="orp-guide"></div>
      <div id="current-word">Ready</div>
    </div>
    <div class="state-indicator" id="state-label">TAP TO START</div>
    <div class="reader-bottom">
      <div class="ctrl-btn" data-action="step-back">◁</div>
      <div class="ctrl-btn" data-action="prev-chapter">⟨⟨</div>
      <div class="play-btn" id="btn-play" data-action="toggle-play">▶</div>
      <div class="ctrl-btn" data-action="next-chapter">⟩⟩</div>
      <div class="ctrl-btn" data-action="step-fwd">▷</div>
    </div>
    <div class="reader-nav">
      <div class="ctrl-btn small" data-action="restart">↺</div>
      <div class="ctrl-btn small" data-action="chapters">☰ Ch.</div>
      <div class="ctrl-btn small" data-action="exit-reader">✕</div>
    </div>
  </div>

  <!-- ═══ CHAPTERS ═══ -->
  <div id="chapters-screen" class="screen">
    <div class="screen-header">Chapters</div>
    <div class="lib-list" id="chapter-list"></div>
    <div class="lib-back" data-action="back-reader">← Back to Reader</div>
  </div>

  <!-- ═══ LIBRARY ═══ -->
  <div id="library-screen" class="screen">
    <div class="screen-header">Library</div>
    <div class="lib-list" id="lib-list"></div>
    <div class="lib-back" data-action="back-menu">← Back to Menu</div>
  </div>

  <!-- ═══ URL IMPORT ═══ -->
  <div id="url-screen" class="screen">
    <div class="screen-header">Import from URL</div>
    <div style="padding:8px 10px;font-size:8px;color:#666;text-align:center;">Paste a direct link to a PDF or EPUB file</div>
    <input type="text" id="url-input" placeholder="https://example.com/book.pdf" style="margin:0 10px;padding:8px;border:1px solid #222;border-radius:6px;background:#141414;color:#f0f0f0;font-size:10px;outline:none;font-family:inherit;width:calc(100% - 20px);">
    <div style="flex:1;"></div>
    <div class="input-actions" style="padding:0 10px 10px;">
      <button data-action="back-menu">← Back</button>
      <button class="primary" data-action="load-url">Import →</button>
    </div>
  </div>

  <script src="books.js"></script>
  <script src="app.js"></script>
</body>
</html>
