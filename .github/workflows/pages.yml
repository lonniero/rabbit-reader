name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - 'rabbit-command/**'
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare deploy folder
        run: |
          mkdir -p _deploy
          # Copy frontend files, libraries, and metadata
          cp -r index.html app.js style.css books.js sw.js manifest.json lib/ rss/ transit-reader/ _deploy/ 2>/dev/null || true
          # Copy images and other assets
          cp -r *.png *.ico *.json _deploy/ 2>/dev/null || true
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_deploy'
      - id: deployment
        uses: actions/deploy-pages@v4
